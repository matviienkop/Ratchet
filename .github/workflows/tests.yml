name: Tests

# The unit tests for every pull request and every push to main. They take under a minute.
# The image build lives in image.yml and runs for pull requests only when they touch the image itself.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Unit tests
        run: python3 -m unittest discover -s tests
